aid: clearflame-engines
name: ClearFlame Engines
description: 'ClearFlame Engine Technologies was a Woodridge, Illinois clean-combustion engine startup
  founded in 2016 by BJ Johnson and Julie Blumreiter, developing a retrofit technology that let
  conventional heavy-duty diesel engines run on ethanol and other low-carbon liquid fuels for the
  hard-to-electrify segments of transportation — long-haul trucking, agriculture, construction and
  other non-road diesel applications. It raised roughly $50M across Series A and B rounds from
  venture and industrial investors including John Deere, and appeared on secondary markets such as
  Forge Global. The company is a hardware and powertrain engineering business with no developer
  program, no public API and no machine-readable specifications; by 2025 it had lost investor
  support, its co-founder CEO had departed, it was listed as not in good standing in Illinois, and
  it moved toward bankruptcy and asset liquidation. Its website no longer serves content.'
